[project]
authors = [{name = "Peter Jackson", email = "peterwjacko@protonmail.com"}]
dependencies = ["galah-python>=0.12.1,<0.13", "jupyterlab-myst>=2.4.2,<3"]
name = "tassie-trees-research-plan"
requires-python = ">= 3.11"
version = "0.1.0"

[build-system]
build-backend = "hatchling.build"
requires = ["hatchling"]

[tool.hatch.build.targets.wheel]
packages = ["src/tassie_trees_research_plan"]

[tool.pixi.workspace]
channels = ["conda-forge"]
platforms = ["osx-arm64", "win-64", "linux-64"]

[tool.pixi.pypi-dependencies]
tassie_trees_research_plan = { path = ".", editable = true }

[tool.pixi.tasks]

[tool.pixi.dependencies]
geopandas = ">=1.1.1,<2"
rasterio = ">=1.4.3,<2"
seaborn = ">=0.13.2,<0.14"
statsmodels = ">=0.14.5,<0.15"
jupyter = ">=1.1.1,<2"
marimo = ">=0.20.4,<0.21"
pystac = ">=1.13.0,<2"
pystac-client = ">=0.8.6,<0.9"
boto3 = ">=1.39.4,<2"
mystmd = ">=1.8.1,<2"
plotnine = ">=0.15.3,<0.16"
folium = ">=0.20.0,<0.21"
leafmap = ">=0.48.6,<0.49"
manim = ">=0.19.0,<0.20"
hugo = ">=0.152.2,<0.153"
scikit-learn = ">=1.7.2,<2"
pvlib = ">=0.15.0,<0.16"
astropy = ">=7.0.0,<8"
contextily = ">=1.7.0,<2"
ipykernel = ">=7.2.0,<8"
planetary-computer = ">=1.0.0,<2"
